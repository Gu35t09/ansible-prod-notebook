[defaults]
inventory = inventory/hosts.ini
roles_path = roles
retry_files_enabled = False
callback_result_format = yaml
# Run the notified handlers even when a later task fails: otherwise a failed
# run leaves new configuration on disk that the services never load.
force_handlers = True

[privilege_escalation]
# Only the admin user is in sudo, with a password (run with -K). The everyday
# user, where Claude Code runs, has no way to root.
become = True
become_method = sudo
become_user = root
