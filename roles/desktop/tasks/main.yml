---
# ==============================================================================
# Role: desktop
# Only the cursor: the macOS theme, installed system-wide by root and set as
# GNOME's default for every user. The rest of the desktop is Zorin's.
# Walkthrough: docs/walkthrough.md, "Role: desktop".
# ==============================================================================

- name: Check the cursor variant
  ansible.builtin.assert:
    that:
      - desktop_cursor_theme in ['macOS', 'macOS-White']
      - desktop_cursor_size | int > 0
    fail_msg: "desktop_cursor_theme must be macOS or macOS-White."
    quiet: true

- name: Create the download directory
  ansible.builtin.file:
    path: "{{ desktop_cursor_cache }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

# get_url verifies the SHA-256 and keeps a file that already matches: the
# download happens once per version.
- name: Download the cursor theme and check it against the pinned checksum
  ansible.builtin.get_url:
    url: "{{ desktop_cursor_url }}"
    dest: "{{ desktop_cursor_cache }}/macOS-{{ desktop_cursor_version }}.tar.xz"
    checksum: "sha256:{{ desktop_cursor_sha256 }}"
    owner: root
    group: root
    mode: "0644"

# Into /usr/share/icons, where GNOME and Xcursor look for themes (the
# desktop, native apps, the browser, the login screen); owned by root, so
# neither user can change it. Flatpak apps keep their runtime's cursor (see
# the walkthrough). Only the chosen variant: the archive's LICENSE and the
# other variant are left out. The archive's own owner (its author's UID) is
# not kept.
- name: Install the cursor theme
  ansible.builtin.unarchive:
    src: "{{ desktop_cursor_cache }}/macOS-{{ desktop_cursor_version }}.tar.xz"
    dest: /usr/share/icons
    remote_src: true
    include:
      - "./{{ desktop_cursor_theme }}"
    owner: root
    group: root
    extra_opts:
      - --no-same-owner
  when: not ansible_check_mode

# GNOME reads its defaults from the compiled schemas. Zorin sets the cursor in
# desktop-specific sections (:zorin, :GNOME-Greeter), which win over a plain
# section: the value is repeated in each of desktop_cursor_sections. Within a
# section, override files are applied in name order: 90 comes after Zorin's
# 25_ and 50_. A user who chose another cursor in Settings keeps it: this
# changes the default, not the choice.
- name: Make the macOS cursor GNOME's default
  ansible.builtin.copy:
    dest: /usr/share/glib-2.0/schemas/90_ansible-desktop.gschema.override
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible (ansible-prod-notebook, role desktop).
      {% for section in desktop_cursor_sections %}

      [org.gnome.desktop.interface{{ ':' ~ section if section else '' }}]
      cursor-theme='{{ desktop_cursor_theme }}'
      cursor-size={{ desktop_cursor_size | int }}
      {% endfor %}
  notify: Compile the GNOME schemas

# A schema override with an unknown key or a bad value would make every
# compilation fail, packages' included: check it before compiling.
- name: Check the schema overrides
  ansible.builtin.command: glib-compile-schemas --strict --dry-run /usr/share/glib-2.0/schemas
  changed_when: false
  check_mode: false
