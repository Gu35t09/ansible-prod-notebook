---
# Reload, never restart: stopping nftables.service runs "nft flush ruleset",
# which would also drop the tables of other tools.
- name: Reload nftables
  ansible.builtin.systemd_service:
    name: nftables
    state: reloaded

# Applies every file in /etc/sysctl.d, in order, without a reboot.
- name: Apply sysctl
  ansible.builtin.command: sysctl --system
  changed_when: true
