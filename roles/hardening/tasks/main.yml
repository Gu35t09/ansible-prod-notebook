---
- name: Make sure no SSH server is installed
  ansible.builtin.apt:
    name: openssh-server
    state: absent
    purge: true

- name: Install nftables
  ansible.builtin.apt:
    name: nftables
    state: present

- name: Write the host firewall
  ansible.builtin.template:
    src: nftables.conf.j2
    dest: /etc/nftables.conf
    owner: root
    group: root
    mode: "0644"
    validate: "nft -c -f %s"
  notify: Reload nftables

- name: Load the firewall at boot
  ansible.builtin.systemd_service:
    name: nftables
    enabled: true
    state: started

- name: Write the kernel and network settings
  ansible.builtin.template:
    src: sysctl.conf.j2
    dest: /etc/sysctl.d/90-hardening.conf
    owner: root
    group: root
    mode: "0644"
  notify: Apply sysctl
