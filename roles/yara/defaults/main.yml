---
# ==============================================================================
# Role yara: defaults. Override them in inventory/group_vars/laptops/main.yml.
# Ported from ansible-prod-srv, with a desktop's paths.
# ==============================================================================

yara_enabled: true
# systemd OnCalendar expression. Daily at 13:30, after the ClamAV scan; a scan
# missed while the laptop was off runs at the next boot, at idle priority.
yara_scan_on_calendar: "*-*-* 13:30:00"

# Files: system binaries and libraries (backdoored ssh client libraries,
# rootkits), software installed outside the packages (/opt, /usr/local),
# the homes, and the places where droppers and miners land.
yara_scan_paths:
  - /usr/bin
  - /usr/sbin
  - /usr/lib
  - /usr/libexec
  - /usr/local
  - /opt
  - /etc
  - /root
  - /home
  - /tmp
  - /var/tmp
  - /var/spool/cron
  - /dev/shm
# Never scanned (find -path patterns): the rules themselves (they contain the
# strings they look for), the ClamAV quarantine (known malware on purpose),
# and the caches, the trash and the Flatpak runtimes of the homes.
yara_exclude_paths:
  - /etc/yara
  - "{{ clamav_quarantine_dir | default('/root/clamav-quarantine') }}"
  - "/home/*/.cache"
  - "/home/*/.local/share/flatpak"
  - "/home/*/.local/share/Trash"
  - "/home/*/.var/app/*/cache"
  # The YARA rules vendored in the clones of ansible-prod-notebook and
  # ansible-prod-srv: they contain the strings they look for.
  - "*/roles/yara/files/rules"
# Larger files are skipped (the Claude Code binary, media, VM images).
yara_max_file_size_mb: 64
yara_threads: 2

# Memory: named processes to scan at every run. The laptop runs no sshd; the
# list is kept for symmetry with the server and is empty by default.
# Processes running from /tmp, /var/tmp, /dev/shm, memfd or a deleted file are
# added at every scan.
yara_process_names: []
# Rule files left out of the memory scan. ESET's SSHDoor rules are written for
# files on disk: in memory they also see the loaded libraries and match a
# clean sshd.
yara_memory_exclude_rules:
  - eset/sshdoor.yar

yara_log_dir: /var/log/yara
yara_log_retention_days: 30
# Notify also when a scan finds nothing (the daily ClamAV message already shows
# that the laptop and the notifications work).
yara_notify_clean: false
